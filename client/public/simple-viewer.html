<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chambre Froide 3D - Visionneuse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #eef2f7; 
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        #container-3d { 
            width: 100vw; 
            height: 100vh; 
        }
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 100;
            max-width: 350px;
        }
        #ui h2 { 
            margin: 0 0 10px 0; 
            color: #2c3e50;
            font-size: 18px;
        }
        #ui p { 
            color: #7f8c8d;
            margin: 5px 0;
            font-size: 14px;
        }
        .status {
            color: #27ae60;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
        }
        .controls {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
        }
        .control-group {
            margin: 10px 0;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            color: #34495e;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .control-group input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            font-size: 13px;
        }
        .control-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
    </style>
</head>
<body>
    <div id="container-3d"></div>

    <div id="ui">
        <h2>Chambre Froide 3D</h2>
        <p><strong>Dimensions:</strong> 2.74m × 1.83m × 2.00m</p>
        <p><strong>Parois:</strong> 80mm épaisseur</p>
        <p><strong>Porte:</strong> 60mm épaisseur</p>
        <div class="status">✓ Connecté</div>
        
        <div class="controls">
            <div class="control-group">
                <label for="temp">Température (°C):</label>
                <input type="number" id="temp" value="-18" step="1" min="-30" max="10">
            </div>
            <div class="control-group">
                <label for="consigne">Consigne (°C):</label>
                <input type="number" id="consigne" value="-18" step="1" min="-30" max="10">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        try {
            // Scene setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf4f7f9);

            const camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(4, 3, 4);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('container-3d').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 8, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Materials
            const panelMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xffffff,
                shininess: 40,
                side: THREE.DoubleSide
            });
            const frameMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x3498db,
                shininess: 60
            });

            // Helper function to add panels
            function addPanel(width, height, depth, x, y, z, name) {
                const geometry = new THREE.BoxGeometry(width, height, depth);
                const mesh = new THREE.Mesh(geometry, panelMaterial);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.name = name;
                scene.add(mesh);

                // Add edges
                const edges = new THREE.EdgesGeometry(geometry);
                const line = new THREE.LineSegments(
                    edges,
                    new THREE.LineBasicMaterial({ color: 0x3498db, linewidth: 2 })
                );
                line.position.copy(mesh.position);
                scene.add(line);

                return mesh;
            }

            // Build the cold room (2.74m × 1.83m × 2.00m internal)
            // Floor
            addPanel(2.74, 0.08, 1.83, 0, -1.04, 0, 'Sol');
            
            // Back wall
            addPanel(2.74, 2.00, 0.08, 0, 0, -0.915, 'Mur Arrière');
            
            // Left wall
            addPanel(0.08, 2.00, 1.83, -1.41, 0, 0, 'Mur Gauche');
            
            // Right wall
            addPanel(0.08, 2.00, 1.83, 1.41, 0, 0, 'Mur Droit');
            
            // Front (partial - with door)
            addPanel(0.5, 2.00, 0.08, -1.12, 0, 0.915, 'Paroi Avant Gauche');
            addPanel(0.5, 2.00, 0.08, 1.12, 0, 0.915, 'Paroi Avant Droite');
            
            // Roof
            addPanel(2.74, 0.08, 1.83, 0, 1.04, 0, 'Toit');

            // Door (60mm thickness)
            const doorGeometry = new THREE.BoxGeometry(1.0, 1.8, 0.06);
            const doorMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xecf0f1,
                shininess: 80
            });
            const door = new THREE.Mesh(doorGeometry, doorMaterial);
            door.position.set(0, -0.1, 0.935);
            door.castShadow = true;
            door.receiveShadow = true;
            scene.add(door);

            // Cooling unit on roof
            const motorGeometry = new THREE.BoxGeometry(0.7, 0.5, 0.6);
            const motor = new THREE.Mesh(motorGeometry, frameMaterial);
            motor.position.set(0, 1.3, 0);
            motor.castShadow = true;
            motor.receiveShadow = true;
            scene.add(motor);

            // Controls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = false;
            controls.enablePan = true;
            controls.enableZoom = true;

            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Handle UI inputs
            document.getElementById('temp').addEventListener('change', (e) => {
                console.log('Température:', e.target.value);
            });
            document.getElementById('consigne').addEventListener('change', (e) => {
                console.log('Consigne:', e.target.value);
            });

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            console.log('✓ Visionneuse 3D initialisée avec succès');
        } catch (e) {
            console.error('Erreur 3D:', e);
            document.body.innerHTML = '<h1 style="padding:20px; color:#e74c3c;">Erreur: ' + e.message + '</h1>';
        }
    </script>
</body>
</html>
